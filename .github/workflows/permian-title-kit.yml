# Runs the Permian title kit's tests until the kit moves to its own repository
# (permian-title-kit/.github/workflows/tests.yml takes over there).
name: Permian title kit

on:
  push:
    paths: ["permian-title-kit/**", ".github/workflows/permian-title-kit.yml"]
  pull_request:
    paths: ["permian-title-kit/**", ".github/workflows/permian-title-kit.yml"]

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: permian-title-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: OCR and PDF tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Install
        run: pip install -e ".[test,ai,xlsx]"
      - name: Tests
        run: python -m pytest -q
      - name: Example deck adds to exactly 1
        run: ptk deck examples/project.json
