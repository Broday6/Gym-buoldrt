<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faux Wood Beam Training</title>
<style>
  :root {
    --bg: #0b1118; --panel: #121b25; --ink: #e8eef3; --mute: #8fa1b2; --accent: #c8a24a; --line: #253445;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #e9edf1; --panel: #ffffff; --ink: #14202b; --mute: #51606e; --line: #c9d2db; }
  }
  :root[data-theme="light"] { --bg: #e9edf1; --panel: #ffffff; --ink: #14202b; --mute: #51606e; --line: #c9d2db; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .stage { width: 100%; aspect-ratio: 16 / 9; background: #0f1720; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .stage svg { display: block; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .controls button, .controls select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .controls button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 700; min-width: 92px; }
  .scrub { flex: 1 1 260px; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--mute); min-width: 96px; text-align: right; }
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 14px; }
  .chapters button { text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .chapters button.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .chapters span { color: var(--mute); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .note { color: var(--mute); font-size: 13px; margin-top: 14px; line-height: 1.5; }
  body.render .wrap { max-width: none; padding: 0; }
  body.render .stage { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
  body.render .controls, body.render .chapters, body.render .note { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="primary" id="play">▶ Play</button>
    <input class="scrub" id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="voice" aria-pressed="true">🔊 Voiceover on</button>
    <select id="speed" aria-label="Playback speed">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
  </div>
  <div class="chapters" id="chapters"></div>
  <audio id="vo" src="voiceover.mp3" preload="auto"></audio>
  <p class="note">Every frame is drawn by code (SVG). Product drawings are schematic. The facts and their sources are in RESEARCH.md. Space = play/pause, ←/→ = 5 s.</p>
</div>
<script src="vo-timing.js"></script>
<script>
/* ============================================================
   Faux wood beam training video, rendered entirely from code.
   frame(T) is a pure function of time, so the player can seek anywhere
   and render.mjs can capture it frame-by-frame to MP4.
   ============================================================ */
const W = 1920, H = 1080;
const FONT = "Inter, 'Segoe UI', Helvetica, Arial, sans-serif";
const MONO = "'DejaVu Sans Mono', Menlo, Consolas, monospace";
const C = {
  bg0: '#0f1720', bg1: '#132131', panel: '#162332', panel2: '#1c2c3e', line: '#2a3b4e',
  ink: '#eef3f7', mute: '#93a5b6', dim: '#5f7184',
  gold: '#d4ad52', blue: '#5fb0d6', green: '#62c28a', amber: '#e59a4f', red: '#e0705a',
};

/* ---------- math + easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, d = .6) => ease(clamp((t - a) / d));
const lerp = (a, b, p) => a + (b - a) * p;
const f1 = n => (+n).toFixed(1);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- svg primitives ---------- */
let UID = 0;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function T(x, y, s, o = {}) {
  const { size = 30, w = 500, fill = C.ink, anchor = 'start', op = 1, ls = 0, fam = FONT, extra = '' } = o;
  if (op <= .001) return '';
  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" opacity="${op.toFixed(3)}" letter-spacing="${ls}" font-family="${fam}" ${extra}>${esc(s)}</text>`;
}
function TL(x, y, lines, o = {}) { const lh = o.lh || (o.size || 30) * 1.3; return lines.map((l, i) => T(x, y + i * lh, l, o)).join(''); }
function wrap(str, max) {
  const words = String(str).split(' '); const out = []; let cur = '';
  for (const wd of words) { if ((cur + ' ' + wd).trim().length > max && cur) { out.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }
  if (cur) out.push(cur); return out;
}
const G = (op, inner, dx = 0, dy = 0) => op <= .001 ? '' : `<g opacity="${op.toFixed(3)}" transform="translate(${f1(dx)},${f1(dy)})">${inner}</g>`;
const rise = (t, a, inner, d = .7, dist = 24) => { const p = prog(t, a, d); return G(p, inner, 0, (1 - p) * dist); };
function rect(x, y, w, h, o = {}) { const { fill = C.panel, stroke = 'none', sw = 1.5, rx = 14, op = 1, extra = '' } = o; return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" ${extra}/>`; }
const textW = (s, size) => String(s).length * size * .56;
function chip(x, y, s, o = {}) {
  const { size = 22, fill = C.panel2, stroke = C.line, color = C.ink, anchor = 'start', w = 600, pad = 16 } = o;
  const tw = textW(s, size) + pad * 2, h = size * 1.75;
  const x0 = anchor === 'middle' ? x - tw / 2 : anchor === 'end' ? x - tw : x;
  return rect(x0, y - h / 2, tw, h, { fill, stroke, rx: h / 2 }) + T(x0 + tw / 2, y + size * .36, s, { size, w, fill: color, anchor: 'middle' });
}
const badge = (x, y, kind, anchor = 'middle') => {
  const k = { load: ['LOAD-BEARING', C.green], deco: ['DECORATIVE', C.amber], check: ['CHECK SKU RATING', C.mute] }[kind];
  return chip(x, y, k[0], { size: 17, w: 800, fill: 'rgba(0,0,0,.25)', stroke: k[1], color: k[1], anchor, pad: 14 });
};
function eyebrowTitle(t, eyebrow, title) {
  return rise(t, .1, T(120, 142, eyebrow, { size: 21, w: 700, fill: C.gold, ls: 3 }) + T(120, 196, title, { size: 52, w: 800 }));
}
const foot = (s, op = 1, x = 1800, y = 898, anchor = 'end') => T(x, y, s, { size: 17, fill: C.dim, anchor, op });

/* ---------- small icons ---------- */
const ico = {
  drop: (x, y, s = 1, c = C.blue) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,-22 C10,-8 16,0 16,8 A16,16 0 0 1 -16,8 C-16,0 -10,-8 0,-22Z" fill="${c}"/>`,
  bug: (x, y, c = C.amber) => `<g transform="translate(${x},${y})" stroke="${c}" stroke-width="2.5" fill="none"><ellipse rx="9" ry="13" fill="${c}"/><path d="M-9,-4 L-18,-10 M-9,4 L-18,8 M9,-4 L18,-10 M9,4 L18,8 M-4,-13 L-8,-21 M4,-13 L8,-21"/><path d="M-22,-24 L22,24" stroke="${C.red}" stroke-width="4"/></g>`,
  sun: (x, y, rot, c = C.gold) => { let s = `<g transform="translate(${x},${y}) rotate(${rot})"><circle r="16" fill="${c}"/>`; for (let i = 0; i < 8; i++) s += `<rect x="-2.5" y="-30" width="5" height="9" rx="2" fill="${c}" transform="rotate(${i * 45})"/>`; return s + '</g>'; },
  shield: (x, y, c = C.green) => `<g transform="translate(${x},${y})"><path d="M0,-22 L18,-14 V2 C18,14 8,21 0,24 C-8,21 -18,14 -18,2 V-14Z" fill="none" stroke="${c}" stroke-width="3"/><path d="M-8,1 L-2,7 L9,-6" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/></g>`,
  flame: (x, y, c = C.amber) => `<g transform="translate(${x},${y})"><path d="M0,-24 C10,-12 16,-4 14,8 A14,14 0 0 1 -14,8 C-15,0 -8,-6 -6,-14 C-2,-8 0,-6 2,-2 C4,-10 2,-18 0,-24Z" fill="none" stroke="${c}" stroke-width="3"/><text x="0" y="12" font-size="13" font-weight="800" fill="${c}" text-anchor="middle" font-family="${FONT}">A</text></g>`,
  house: (x, y, c = C.blue) => `<g transform="translate(${x},${y})" fill="none" stroke="${c}" stroke-width="3"><path d="M-18,0 L0,-16 L18,0 M-13,-4 V16 H13 V-4"/><rect x="-4" y="4" width="8" height="12"/></g>`,
};

/* ---------- wood drawing ---------- */
// Approximate on-screen colors for named finishes (illustrative; real finishes vary by batch).
const FIN = {
  aged: '#5b3a24', hickory: '#8a5a32', mahogany: '#5a2a1c', almond: '#d6bf9b', toffee: '#9a6338', sandDune: '#c4a780',
  buttercream: '#e6d6b0', champagne: '#d3c3a8', cherry: '#7a3322', pecan: '#8c5b3a', redwood: '#8d3f2b', prepped: '#e4ded2',
  whiteOak: '#c4a275', caramel: '#a8713f', kona: '#5a3d2b', sandstone: '#cbb595', walnut: '#4e3322',
};
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + c.map(v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)).map(v => v.toString(16).padStart(2, '0')).join('');
}
const TEXTURES = [
  ['handhewn', 'Hand Hewn', 'HH', 'adze-cut scallops'], ['roughsawn', 'Rough Sawn', 'RS', 'saw-blade marks'],
  ['sandblasted', 'Sandblasted', 'SD', 'raised, weathered grain'], ['riverwood', 'Riverwood', 'RW', 'water-worn flow'],
  ['knotty', 'Knotty Pine', 'KP', 'knots'], ['pecky', 'Pecky Cypress', 'PC', 'pockets'],
  ['cedar', 'Rough Cedar', 'RC', 'fibrous face'], ['smooth', 'Rustic Smooth', 'SM', 'cleanest face'],
];
/* One textured wood face, grain running horizontally. Procedural and seeded, so it is
   identical on every frame. */
function woodFace(x, y, w, h, tex, col, seed = 1, o = {}) {
  if (w < 2 || h < 2) return '';
  const id = 'w' + (UID++), rnd = rng(seed), dk = shade(col, -.38), dk2 = shade(col, -.62), lt = shade(col, .22);
  const sc = o.scale || 1;
  let g = '';
  const grain = (amp, freq, op, wid, rows) => {
    rows = rows || Math.max(3, Math.round(h / (9 * sc)));
    for (let i = 0; i < rows; i++) {
      const yy = y + (i + rnd()) * h / rows, ph = rnd() * 6, n = Math.max(6, Math.ceil(w / 16)); let d = '';
      for (let k = 0; k <= n; k++) { const xx = x + k * w / n; const yv = yy + Math.sin(xx * freq / sc + ph) * amp * sc + Math.sin(xx * freq * 2.7 / sc + ph * 2) * amp * .4 * sc; d += (k ? 'L' : 'M') + f1(xx) + ',' + f1(yv); }
      g += `<path d="${d}" fill="none" stroke="${dk}" stroke-opacity="${op}" stroke-width="${f1(wid * sc)}"/>`;
    }
  };
  const checks = (n) => { for (let i = 0; i < n; i++) { const cx = x + rnd() * w, cy = y + (.15 + rnd() * .7) * h, L = (20 + rnd() * 60) * sc; g += `<path d="M${f1(cx)},${f1(cy)} l${f1(L * .5)},${f1((rnd() - .5) * 3)} l${f1(L * .5)},${f1((rnd() - .5) * 3)}" stroke="${dk2}" stroke-width="${f1(1.4 * sc)}" stroke-opacity=".7" fill="none"/>`; } };
  switch (tex) {
    case 'smooth': grain(1, .012, .16, 1); checks(Math.round(w / 400)); break;
    case 'sandblasted':
      grain(2.2, .012, .55, 1.8);
      for (let i = 0; i < Math.round(h / (11 * sc)); i++) { const yy = y + (i + .5) * h / Math.round(h / (11 * sc)); g += `<line x1="${f1(x)}" y1="${f1(yy)}" x2="${f1(x + w)}" y2="${f1(yy + rnd() * 2)}" stroke="${lt}" stroke-opacity=".35" stroke-width="${f1(1.2 * sc)}"/>`; }
      break;
    case 'riverwood': grain(h * .06 / sc, .005, .4, 2.2, Math.max(3, Math.round(h / (13 * sc)))); grain(1, .02, .15, 1); break;
    case 'roughsawn': {
      grain(1.3, .01, .22, 1);
      const sp = 22 * sc, R = h * 2.6;
      for (let xx = x - R; xx < x + w + R; xx += sp) g += `<circle cx="${f1(xx)}" cy="${f1(y + h * 2.8)}" r="${f1(R)}" fill="none" stroke="${dk}" stroke-opacity=".34" stroke-width="${f1(2.4 * sc)}"/>`;
      checks(Math.round(w / 300)); break;
    }
    case 'handhewn': {
      grain(1.3, .01, .22, 1);
      const bands = Math.max(2, Math.round(h / (34 * sc)));
      for (let b = 0; b < bands; b++) {
        let xx = x - rnd() * 40 * sc; const yy = y + (b + .5) * h / bands, bh = h / bands;
        while (xx < x + w) { const sw = (38 + rnd() * 50) * sc;
          g += `<ellipse cx="${f1(xx + sw / 2)}" cy="${f1(yy)}" rx="${f1(sw / 2)}" ry="${f1(bh * .48)}" fill="${dk}" fill-opacity="${(.1 + rnd() * .14).toFixed(2)}"/>`
            + `<path d="M${f1(xx + sw)},${f1(yy - bh * .45)} q${f1(-4 * sc)},${f1(bh * .45)} 0,${f1(bh * .9)}" stroke="${lt}" stroke-opacity=".35" stroke-width="${f1(1.5 * sc)}" fill="none"/>`;
          xx += sw; }
      }
      checks(Math.round(w / 260)); break;
    }
    case 'knotty': {
      grain(2, .011, .3, 1.2);
      const n = Math.max(1, Math.round(w / (170 * sc)));
      for (let i = 0; i < n; i++) { const kx = x + (i + .2 + rnd() * .6) * w / n, ky = y + (.2 + rnd() * .6) * h, r = (6 + rnd() * 7) * sc;
        g += `<ellipse cx="${f1(kx)}" cy="${f1(ky)}" rx="${f1(r * 1.5)}" ry="${f1(r)}" fill="${dk2}"/><ellipse cx="${f1(kx)}" cy="${f1(ky)}" rx="${f1(r * 2.4)}" ry="${f1(r * 1.6)}" fill="none" stroke="${dk}" stroke-opacity=".5" stroke-width="${f1(1.2 * sc)}"/>`; }
      break;
    }
    case 'pecky': {
      grain(1.3, .011, .22, 1);
      const n = Math.max(2, Math.round(w * h / (2600 * sc * sc)));
      for (let i = 0; i < n; i++) { const px = x + rnd() * w, py = y + (.1 + rnd() * .8) * h, L = (7 + rnd() * 20) * sc;
        g += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="${f1(L)}" ry="${f1((1.6 + rnd() * 2.2) * sc)}" fill="${dk2}" fill-opacity=".85"/>`; }
      break;
    }
    case 'cedar': {
      grain(1, .02, .2, 1);
      const n = Math.round(w * h / (140 * sc * sc));
      for (let i = 0; i < n; i++) { const px = x + rnd() * w, py = y + rnd() * h, L = (6 + rnd() * 16) * sc;
        g += `<line x1="${f1(px)}" y1="${f1(py)}" x2="${f1(px + L)}" y2="${f1(py + (rnd() - .5) * 1.5)}" stroke="${rnd() < .5 ? dk : lt}" stroke-opacity=".55" stroke-width="${f1(1.4 * sc)}"/>`; }
      break;
    }
  }
  return `<g><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lt}"/><stop offset=".45" stop-color="${col}"/><stop offset="1" stop-color="${shade(col, -.18)}"/></linearGradient>`
    + `<clipPath id="${id}c"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}"/></clipPath></defs>`
    + `<g clip-path="url(#${id}c)"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="url(#${id}g)"/>${g}</g>`
    + (o.edge === false ? '' : `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="none" stroke="${dk2}" stroke-opacity=".6" stroke-width="1"/>`) + '</g>';
}
/* A beam seen from the side (elevation): textured face plus a darker underside strip. */
function beamSide(x, y, len, h, tex, col, seed = 3) {
  return woodFace(x, y, len, h, tex, col, seed) + `<rect x="${f1(x)}" y="${f1(y + h - 4)}" width="${f1(len)}" height="4" fill="#000" opacity=".25"/>`;
}
/* Cross-section of a beam hanging from a ceiling line. type U | L | P (plank). Sizes in px. */
function section(type, x0, y0, W, H, o = {}) {
  const { t = 12, col = FIN.hickory, block = true, label = '', ceiling = true, wallRight = type === 'L' } = o;
  const dk = shade(col, -.45);
  let s = '';
  if (ceiling) s += `<rect x="${f1(x0 - 40)}" y="${f1(y0 - 22)}" width="${f1(W + 80)}" height="22" fill="url(#hatch)" stroke="#4b5b6c"/>`;
  if (wallRight) s += `<rect x="${f1(x0 + W)}" y="${f1(y0 - 22)}" width="22" height="${f1(H + 60)}" fill="url(#hatch)" stroke="#4b5b6c"/>`;
  let pts;
  if (type === 'U') pts = [[x0, y0], [x0, y0 + H], [x0 + W, y0 + H], [x0 + W, y0], [x0 + W - t, y0], [x0 + W - t, y0 + H - t], [x0 + t, y0 + H - t], [x0 + t, y0]];
  else if (type === 'L') pts = [[x0, y0], [x0, y0 + H], [x0 + W, y0 + H], [x0 + W, y0 + H - t], [x0 + t, y0 + H - t], [x0 + t, y0]];
  else pts = [[x0, y0], [x0, y0 + t], [x0 + W, y0 + t], [x0 + W, y0]];
  s += `<polygon points="${pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ')}" fill="${col}" stroke="${dk}" stroke-width="2"/>`;
  if (block && type !== 'P') {
    const bw = type === 'U' ? W - 2 * t - 4 : W - t - 4, bh = Math.min(H - t - 6, (o.blockH || 34));
    const bx = type === 'U' ? x0 + t + 2 : x0 + t + 2;
    s += `<rect x="${f1(bx)}" y="${f1(y0)}" width="${f1(bw)}" height="${f1(bh)}" fill="#c9a272" stroke="#7a5a35" stroke-width="1.5"/><path d="M${f1(bx)},${f1(y0)} l${f1(bw)},${f1(bh)} M${f1(bx + bw)},${f1(y0)} l${f1(-bw)},${f1(bh)}" stroke="#7a5a35" stroke-width="1" opacity=".6"/>`;
  }
  if (label) s += T(x0 + W / 2, y0 + H + 34, label, { size: 22, w: 700, anchor: 'middle' });
  return s;
}
/* One-point perspective room with beams crossing the ceiling. n beams, each appears at appear[i]. */
function room(t, o = {}) {
  const { beams = 5, tex = 'handhewn', col = FIN.aged, appear = [], op = 1, dy = 0 } = o;
  const vx0 = 640, vx1 = 1280, vy0 = 330, vy1 = 760, top = 90, bot = 1080;
  let s = `<polygon points="0,${top} 1920,${top} ${vx1},${vy0} ${vx0},${vy0}" fill="#d8d1c4"/>`
    + `<polygon points="0,${top} ${vx0},${vy0} ${vx0},${vy1} 0,${bot}" fill="#c7bdac"/>`
    + `<polygon points="1920,${top} ${vx1},${vy0} ${vx1},${vy1} 1920,${bot}" fill="#bfb5a4"/>`
    + `<polygon points="0,${bot} ${vx0},${vy1} ${vx1},${vy1} 1920,${bot}" fill="#7b5b3e"/>`
    + `<rect x="${vx0}" y="${vy0}" width="${vx1 - vx0}" height="${vy1 - vy0}" fill="#e3dccf"/>`
    + `<rect x="${vx0 + 210}" y="${vy0 + 90}" width="220" height="210" fill="#9fc3d6" stroke="#f4efe6" stroke-width="10"/><line x1="${vx0 + 320}" y1="${vy0 + 90}" x2="${vx0 + 320}" y2="${vy0 + 300}" stroke="#f4efe6" stroke-width="6"/>`;
  for (let i = 0; i < 6; i++) { const yy = vy1 + (bot - vy1) * Math.pow(i / 6, 1.6); s += `<line x1="${f1(lerp(vx0, 0, (yy - vy1) / (bot - vy1)))}" y1="${f1(yy)}" x2="${f1(lerp(vx1, 1920, (yy - vy1) / (bot - vy1)))}" y2="${f1(yy)}" stroke="#5e4430" stroke-width="2" opacity=".5"/>`; }
  const P = z => ({ y: lerp(top, vy0, z), xl: lerp(0, vx0, z), xr: lerp(1920, vx1, z), s: lerp(1, (vx1 - vx0) / 1920, z) });
  const zs = []; for (let i = 0; i < beams; i++) zs.push(.1 + i * .8 / Math.max(1, beams - 1));
  for (let i = beams - 1; i >= 0; i--) {
    const a = appear[i] == null ? -1 : appear[i], p = a < 0 ? 1 : prog(t, a, .9);
    if (p <= 0) continue;

   Engine: header, captions, timeline, player.
   ============================================================ */
/* Timeline. Each caption is a cue. Without a voiceover a cue lasts as designed; with
   vo-timing.js (from voiceover.py) each cue is stretched to fit its narration, and the
   animation inside the cue is stretched by the same factor so reveals stay on their line. */
let acc = 0; SCENES.forEach(sc => { sc.ostart = acc; acc += sc.dur; });
const CUES = [];
SCENES.forEach((sc, si) => sc.caps.forEach((c, ci) => CUES.push({ si, o0: c[0], o1: ci + 1 < sc.caps.length ? sc.caps[ci + 1][0] : sc.dur })));
const VO = window.VO_TIMING && window.VO_TIMING.length === CUES.length ? window.VO_TIMING : null;
{ let a = 0; CUES.forEach((q, i) => { q.n0 = VO ? VO[i].newStart : a; q.nd = VO ? VO[i].newDur : q.o1 - q.o0; a = q.n0 + q.nd; }); }
SCENES.forEach((sc, si) => { const qs = CUES.filter(q => q.si === si); sc.start = qs[0].n0; sc.ndur = qs.reduce((x, q) => x + q.nd, 0); });
const TOTAL = CUES[CUES.length - 1].n0 + CUES[CUES.length - 1].nd;
function locate(Tm) {
  let q = CUES[0]; for (const c of CUES) { if (Tm >= c.n0) q = c; else break; }
  return { i: q.si, lt: q.o0 + clamp((Tm - q.n0) / q.nd) * (q.o1 - q.o0), nlt: Tm - SCENES[q.si].start };
}
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function sceneAt(Tm) { for (let i = SCENES.length - 1; i >= 0; i--) if (Tm >= SCENES[i].start) return i; return 0; }
function captionSvg(sc, lt, fadeOp) {
  let cur = null, ct = 0; sc.caps.forEach(c => { if (lt >= c[0]) { cur = c[1]; ct = c[0]; } });
  if (!cur) return '';
  const op = Math.min(prog(lt, ct, .35), fadeOp), lines = wrap(cur, 74);
  const h = 40 + lines.length * 44, y = 1040 - h;
  return G(op, rect(150, y, 1620, h, { fill: 'rgba(5,10,16,.78)', rx: 16 }) + TL(960, y + 50, lines, { size: 34, w: 500, anchor: 'middle', lh: 44 }));
}
function frameSvg(Tm) {
  Tm = clamp(Tm, 0, TOTAL - 1e-3);
  const { i, lt, nlt } = locate(Tm), sc = SCENES[i];
  const fadeOp = Math.min(clamp(nlt / .5), clamp((sc.ndur - nlt) / .45));
  UID = 0;
  let body = '';
  try { body = sc.draw(lt); } catch (e) { body = T(960, 540, 'Render error: ' + e.message, { size: 30, fill: C.red, anchor: 'middle' }); console.error(e); }
  const ticks = SCENES.map(s2 => `<rect x="${f1(s2.start / TOTAL * W)}" y="82" width="2" height="8" fill="${C.bg0}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs><radialGradient id="bgg" cx=".5" cy=".35" r=".9"><stop offset="0" stop-color="${C.bg1}"/><stop offset="1" stop-color="${C.bg0}"/></radialGradient>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#2b3946"/><line x1="0" y1="0" x2="0" y2="10" stroke="#566778" stroke-width="3"/></pattern>
<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern></defs>
<rect width="${W}" height="${H}" fill="url(#bgg)"/><rect width="${W}" height="${H}" fill="url(#grid)"/>
<g opacity="${fadeOp.toFixed(3)}">${body}</g>
<rect x="0" y="0" width="${W}" height="82" fill="#0a121a" opacity=".85"/>
<text x="60" y="50" font-size="21" letter-spacing="3" font-family="${FONT}" fill="${C.ink}" font-weight="800">${esc(BRAND)}<tspan font-weight="500" fill="${C.mute}">  ·  PRODUCT TRAINING</tspan></text>
${T(1860, 50, `${String(i + 1).padStart(2, '0')} / ${SCENES.length}   ${sc.chapter}`, { size: 21, w: 600, fill: C.mute, anchor: 'end' })}
<rect x="0" y="82" width="${W}" height="8" fill="#1b2836"/><rect x="0" y="82" width="${f1(Tm / TOTAL * W)}" height="8" fill="${C.gold}"/>${ticks}
${captionSvg(sc, lt, fadeOp)}
</svg>`;
}

scrub.max = TOTAL;
const chapEl = document.getElementById('chapters');
SCENES.forEach((sc, i) => { const b = document.createElement('button'); b.innerHTML = `<span>${fmt(sc.start)}</span>${String(i + 1).padStart(2, '0')} · ${sc.chapter}`; b.onclick = () => { seek(sc.start + .01); }; chapEl.appendChild(b); });
function paint() {
  stage.innerHTML = frameSvg(now);
  scrub.value = now; timeEl.textContent = fmt(now) + ' / ' + fmt(TOTAL);
  const ci = sceneAt(now); [...chapEl.children].forEach((b, i) => b.classList.toggle('on', i === ci));
}
// Voiceover: when the narration is loaded and on, the audio clock drives the picture.
const vo = document.getElementById('vo'), voiceBtn = document.getElementById('voice');
let voiceOn = !!VO, voOk = false;
vo.addEventListener('canplay', () => { voOk = true; });
vo.addEventListener('error', () => { voOk = false; voiceBtn.textContent = '🔇 No voiceover file'; voiceBtn.disabled = true; });
if (!VO) { voiceBtn.textContent = '🔇 No voiceover timing'; voiceBtn.disabled = true; }
const audioDriving = () => voiceOn && voOk && !vo.paused;
function syncAudio() { if (!voiceOn || !voOk) return; if (Math.abs(vo.currentTime - now) > .08) vo.currentTime = now; vo.playbackRate = speed; if (playing) vo.play().catch(() => {}); else vo.pause(); }
function seek(t) { now = clamp(t, 0, TOTAL); syncAudio(); paint(); }
function loop(ts) {
  if (!playing) return;
  const dt = (ts - last) / 1000; last = ts;
  now = audioDriving() ? vo.currentTime : now + dt * speed;
  if (now >= TOTAL) { now = TOTAL; playing = false; vo.pause(); playBtn.textContent = '↺ Replay'; }
  paint(); if (playing) requestAnimationFrame(loop);
}
function toggle() { if (now >= TOTAL) now = 0; playing = !playing; playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play'; syncAudio(); if (playing) { last = performance.now(); requestAnimationFrame(loop); } }
playBtn.onclick = toggle;
voiceBtn.onclick = () => { voiceOn = !voiceOn; voiceBtn.textContent = voiceOn ? '🔊 Voiceover on' : '🔈 Voiceover off'; voiceBtn.setAttribute('aria-pressed', voiceOn); if (!voiceOn) vo.pause(); else syncAudio(); };
scrub.oninput = () => seek(+scrub.value);
document.getElementById('speed').onchange = e => { speed = +e.target.value; syncAudio(); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.code === 'ArrowRight') seek(now + 5); if (e.code === 'ArrowLeft') seek(now - 5); });
// Hooks for render.mjs (frame-exact capture).
window.__TOTAL = TOTAL;
window.__seek = t => { now = t; stage.innerHTML = frameSvg(t); };
window.__chapters = SCENES.map(s2 => ({ chapter: s2.chapter, start: s2.start, dur: s2.ndur }));
window.__captions = SCENES.flatMap((s2, si) => s2.caps.map((c, ci) => ({
  scene: si + 1, chapter: s2.chapter, start: +(s2.ostart + c[0]).toFixed(2),
  end: +(s2.ostart + (ci + 1 < s2.caps.length ? s2.caps[ci + 1][0] : s2.dur)).toFixed(2), text: c[1] })));
paint();
</script>
</body>
