<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endura-Stone Column Training</title>
<style>
  :root {
    --bg: #0b1118; --panel: #121b25; --ink: #e8eef3; --mute: #8fa1b2; --accent: #c8a24a; --line: #253445;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #e9edf1; --panel: #ffffff; --ink: #14202b; --mute: #51606e; --line: #c9d2db; }
  }
  :root[data-theme="light"] { --bg: #e9edf1; --panel: #ffffff; --ink: #14202b; --mute: #51606e; --line: #c9d2db; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .stage { width: 100%; aspect-ratio: 16 / 9; background: #0f1720; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .stage svg { display: block; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .controls button, .controls select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .controls button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 700; min-width: 92px; }
  .scrub { flex: 1 1 260px; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--mute); min-width: 96px; text-align: right; }
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 14px; }
  .chapters button { text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .chapters button.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .chapters span { color: var(--mute); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .note { color: var(--mute); font-size: 13px; margin-top: 14px; line-height: 1.5; }
  body.render .wrap { max-width: none; padding: 0; }
  body.render .stage { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
  body.render .controls, body.render .chapters, body.render .note { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="primary" id="play">▶ Play</button>
    <input class="scrub" id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="speed" aria-label="Playback speed">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    </select>
  </div>
  <div class="chapters" id="chapters"></div>
  <p class="note">Every frame is drawn by code (SVG). Product drawings are schematic. The facts and their sources are in RESEARCH.md. Space = play/pause, ←/→ = 5 s.</p>
</div>
<script>
/* ============================================================
   Endura-Stone column training video, rendered entirely from code.
   frame(T) is a pure function of time, so the player can seek anywhere
   and render.mjs can capture it frame-by-frame to MP4.
   ============================================================ */
const W = 1920, H = 1080;
const FONT = "Inter, 'Segoe UI', Helvetica, Arial, sans-serif";
const MONO = "'DejaVu Sans Mono', Menlo, Consolas, monospace";
const C = {
  bg0: '#0f1720', bg1: '#132131', panel: '#162332', panel2: '#1c2c3e', line: '#2a3b4e',
  ink: '#eef3f7', mute: '#93a5b6', dim: '#5f7184',
  gold: '#d4ad52', blue: '#5fb0d6', green: '#62c28a', amber: '#e59a4f', red: '#e0705a',
};

/* ---------- math + easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, d = .6) => ease(clamp((t - a) / d));
const lerp = (a, b, p) => a + (b - a) * p;
const f1 = n => (+n).toFixed(1);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- svg primitives ---------- */
let UID = 0;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function T(x, y, s, o = {}) {
  const { size = 30, w = 500, fill = C.ink, anchor = 'start', op = 1, ls = 0, fam = FONT, extra = '' } = o;
  if (op <= .001) return '';
  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" opacity="${op.toFixed(3)}" letter-spacing="${ls}" font-family="${fam}" ${extra}>${esc(s)}</text>`;
}
function TL(x, y, lines, o = {}) { const lh = o.lh || (o.size || 30) * 1.3; return lines.map((l, i) => T(x, y + i * lh, l, o)).join(''); }
function wrap(str, max) {
  const words = String(str).split(' '); const out = []; let cur = '';
  for (const wd of words) { if ((cur + ' ' + wd).trim().length > max && cur) { out.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }
  if (cur) out.push(cur); return out;
}
const G = (op, inner, dx = 0, dy = 0) => op <= .001 ? '' : `<g opacity="${op.toFixed(3)}" transform="translate(${f1(dx)},${f1(dy)})">${inner}</g>`;
const rise = (t, a, inner, d = .7, dist = 24) => { const p = prog(t, a, d); return G(p, inner, 0, (1 - p) * dist); };
function rect(x, y, w, h, o = {}) { const { fill = C.panel, stroke = 'none', sw = 1.5, rx = 14, op = 1, extra = '' } = o; return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" ${extra}/>`; }
const textW = (s, size) => String(s).length * size * .56;
function chip(x, y, s, o = {}) {
  const { size = 22, fill = C.panel2, stroke = C.line, color = C.ink, anchor = 'start', w = 600, pad = 16 } = o;
  const tw = textW(s, size) + pad * 2, h = size * 1.75;
  const x0 = anchor === 'middle' ? x - tw / 2 : anchor === 'end' ? x - tw : x;
  return rect(x0, y - h / 2, tw, h, { fill, stroke, rx: h / 2 }) + T(x0 + tw / 2, y + size * .36, s, { size, w, fill: color, anchor: 'middle' });
}
const badge = (x, y, kind, anchor = 'middle') => {
  const k = { load: ['LOAD-BEARING', C.green], deco: ['DECORATIVE', C.amber], check: ['CHECK SKU RATING', C.mute] }[kind];
  return chip(x, y, k[0], { size: 17, w: 800, fill: 'rgba(0,0,0,.25)', stroke: k[1], color: k[1], anchor, pad: 14 });
};
function eyebrowTitle(t, eyebrow, title) {
  return rise(t, .1, T(120, 142, eyebrow, { size: 21, w: 700, fill: C.gold, ls: 3 }) + T(120, 196, title, { size: 52, w: 800 }));
}
const foot = (s, op = 1, x = 1800, y = 898, anchor = 'end') => T(x, y, s, { size: 17, fill: C.dim, anchor, op });

/* ---------- column drawing (elevation) ---------- */
const PAL = {
  stone: { s: ['#9c927f', '#d9d2c4', '#f7f4ec', '#fffdf8', '#e2dbcd', '#a89e8b'], line: '#857b6a' },
  pvc:   { s: ['#a3abb2', '#e1e6ea', '#fbfcfd', '#ffffff', '#e6eaee', '#aeb6bd'], line: '#8b949c' },
  wood:  { s: ['#4a2e1a', '#7a5233', '#9a6d47', '#a3784f', '#80583a', '#4f321d'], line: '#2e1a0d' },
  alu:   { s: ['#1d2023', '#383d42', '#5b6167', '#6b7177', '#444a50', '#222528'], line: '#111315' },
  lite:  { s: ['#b2aea6', '#e8e5df', '#fbfaf7', '#ffffff', '#ecE9e3', '#bdb8af'], line: '#9a958c' },
};
const CAPK = { none: 0, tuscan: 1.0, doric: 1.22, ionic: 1.18, scamozzi: 1.18, corinthian: 2.38, craftsman: .95 };
const BASEK = { none: 0, tuscan: .8, attic: .95, pedestal: 3.0, craftsman: .95 };

function gradDef(id, x, half, P) {
  const offs = [0, .18, .42, .55, .8, 1];
  return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f1(x - half)}" y1="0" x2="${f1(x + half)}" y2="0">${P.s.map((c, i) => `<stop offset="${offs[i]}" stop-color="${c}"/>`).join('')}</linearGradient>`;
}
const R_ = (fill, ln) => (cx, y, w, h, rx = 0) => `<rect x="${f1(cx - w / 2)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(rx)}" fill="${fill}" stroke="${ln}" stroke-width="1.2"/>`;

function spiral(cx, cy, R, dir, rot, ln, fill) {
  const turns = 2.2, n = 70; let d = '';
  for (let i = 0; i <= n; i++) {
    const a = i / n * turns * Math.PI * 2, r = R * (1 - i / n * .86), ang = rot + dir * a;
    d += (i ? 'L' : 'M') + f1(cx + r * Math.cos(ang)) + ',' + f1(cy + r * Math.sin(ang));
  }
  return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" fill="${fill}" stroke="${ln}" stroke-width="1.2"/><path d="${d}" fill="none" stroke="${ln}" stroke-width="${f1(Math.max(1, R * .09))}" stroke-linecap="round"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * .14)}" fill="${ln}" opacity=".6"/>`;
}
function leaf(bx, by, w, h, fill, ln) {
  return `<path d="M${f1(bx - w / 2)},${f1(by)} Q${f1(bx - w * .75)},${f1(by - h * .55)} ${f1(bx - w * .1)},${f1(by - h)} Q${f1(bx + w * .35)},${f1(by - h * 1.06)} ${f1(bx + w * .22)},${f1(by - h * .86)} Q${f1(bx + w * .7)},${f1(by - h * .5)} ${f1(bx + w / 2)},${f1(by)} Z" fill="${fill}" stroke="${ln}" stroke-width="1.1"/><path d="M${f1(bx)},${f1(by)} Q${f1(bx - w * .05)},${f1(by - h * .5)} ${f1(bx - w * .08)},${f1(by - h * .9)}" stroke="${ln}" stroke-width="1" fill="none" opacity=".7"/>`;
}
function capSvg(type, x, y, u, fill, ln) {
  const R = R_(fill, ln);
  const echinus = (y0, y1, w0, w1) => `<path d="M${f1(x - w0)},${f1(y0)} C${f1(x - w0 * 1.12)},${f1(y0 - (y0 - y1) * .3)} ${f1(x - w1 * .98)},${f1(y0 - (y0 - y1) * .7)} ${f1(x - w1)},${f1(y1)} L${f1(x + w1)},${f1(y1)} C${f1(x + w1 * .98)},${f1(y0 - (y0 - y1) * .7)} ${f1(x + w0 * 1.12)},${f1(y0 - (y0 - y1) * .3)} ${f1(x + w0)},${f1(y0)} Z" fill="${fill}" stroke="${ln}" stroke-width="1.2"/>`;
  const eggs = (yy, span, n, rx, ry) => { let s = ''; for (let i = 0; i < n; i++) { const xx = x - span + 2 * span * i / (n - 1); s += `<ellipse cx="${f1(xx)}" cy="${f1(yy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="none" stroke="${ln}" stroke-width="1" opacity=".75"/>`; } return s; };
  const concaveAbacus = (yb, h, w) => `<path d="M${f1(x - w)},${f1(yb)} Q${f1(x - w * .86)},${f1(yb - h / 2)} ${f1(x - w)},${f1(yb - h)} L${f1(x + w)},${f1(yb - h)} Q${f1(x + w * .86)},${f1(yb - h / 2)} ${f1(x + w)},${f1(yb)} Z" fill="${fill}" stroke="${ln}" stroke-width="1.2"/>`;
  switch (type) {
    case 'tuscan':
      return R(x, y - .12 * u, 2.2 * u, .12 * u, .06 * u) + R(x, y - .4 * u, 2 * u, .28 * u) + echinus(y - .4 * u, y - .7 * u, u, 1.38 * u) + R(x, y - 1.0 * u, 2.9 * u, .3 * u);
    case 'doric':
      return R(x, y - .12 * u, 2.2 * u, .12 * u, .06 * u) + R(x, y - .4 * u, 2 * u, .28 * u) + echinus(y - .4 * u, y - .74 * u, u, 1.4 * u) + eggs(y - .58 * u, 1.05 * u, 7, .1 * u, .1 * u)
        + R(x, y - 1.04 * u, 2.95 * u, .3 * u) + R(x, y - 1.22 * u, 3.05 * u, .18 * u);
    case 'ionic': case 'scamozzi': {
      const sc = type === 'scamozzi';
      let s = R(x, y - .1 * u, 2.2 * u, .1 * u, .05 * u) + R(x, y - .44 * u, 2.3 * u, .34 * u, .1 * u) + eggs(y - .27 * u, 1.0 * u, 6, .11 * u, .12 * u)
        + R(x, y - .88 * u, 2.3 * u, .44 * u, .12 * u);
      s += spiral(x - 1.18 * u, y - (sc ? .5 : .62) * u, .38 * u, -1, sc ? -2.2 : -1.57, ln, fill) + spiral(x + 1.18 * u, y - (sc ? .5 : .62) * u, .38 * u, 1, sc ? -.95 : -1.57, ln, fill);
      s += sc ? concaveAbacus(y - .88 * u, .3 * u, 1.55 * u) : R(x, y - 1.18 * u, 2.75 * u, .3 * u);
      return s;
    }
    case 'corinthian': {
      let s = R(x, y - .12 * u, 2.2 * u, .12 * u, .06 * u);
      s += `<path d="M${f1(x - u)},${f1(y - .12 * u)} L${f1(x - 1.22 * u)},${f1(y - 2.05 * u)} L${f1(x + 1.22 * u)},${f1(y - 2.05 * u)} L${f1(x + u)},${f1(y - .12 * u)} Z" fill="${fill}" stroke="${ln}" stroke-width="1.2"/>`;
      for (let i = 0; i < 4; i++) s += leaf(x - .78 * u + i * .52 * u, y - .5 * u, .55 * u, 1.05 * u, fill, ln);
      for (let i = 0; i < 5; i++) s += leaf(x - 1.0 * u + i * .5 * u, y - .12 * u, .55 * u, .78 * u, fill, ln);
      s += spiral(x - 1.18 * u, y - 1.88 * u, .2 * u, -1, -1.2, ln, fill) + spiral(x + 1.18 * u, y - 1.88 * u, .2 * u, 1, -1.9, ln, fill);
      s += concaveAbacus(y - 2.05 * u, .33 * u, 1.5 * u) + `<circle cx="${f1(x)}" cy="${f1(y - 2.21 * u)}" r="${f1(.11 * u)}" fill="${fill}" stroke="${ln}"/>`;
      return s;
    }
    case 'craftsman':
      return R(x, y - .3 * u, 2.35 * u, .3 * u) + R(x, y - .6 * u, 2.65 * u, .3 * u) + R(x, y - .95 * u, 3.0 * u, .35 * u);
    default: return '';
  }
}
function baseSvg(type, x, y, rb, fill, ln) {
  const R = R_(fill, ln);
  switch (type) {
    case 'tuscan': return R(x, y - .38 * rb, 2.8 * rb, .38 * rb) + R(x, y - .72 * rb, 2.5 * rb, .34 * rb, .17 * rb) + R(x, y - .8 * rb, 2.1 * rb, .08 * rb);
    case 'attic': return R(x, y - .3 * rb, 2.8 * rb, .3 * rb) + R(x, y - .56 * rb, 2.6 * rb, .26 * rb, .13 * rb) + R(x, y - .7 * rb, 2.12 * rb, .14 * rb)
      + R(x, y - .9 * rb, 2.35 * rb, .2 * rb, .1 * rb) + R(x, y - .95 * rb, 2.08 * rb, .05 * rb);
    case 'pedestal': return R(x, y - .3 * rb, 3.3 * rb, .3 * rb) + R(x, y - 2.65 * rb, 3.0 * rb, 2.35 * rb)
      + `<rect x="${f1(x - 1.15 * rb)}" y="${f1(y - 2.4 * rb)}" width="${f1(2.3 * rb)}" height="${f1(1.85 * rb)}" fill="none" stroke="${ln}" stroke-width="1.2" opacity=".7"/>` + R(x, y - 3.0 * rb, 3.3 * rb, .35 * rb);
    case 'craftsman': return R(x, y - .6 * rb, 2.8 * rb, .6 * rb) + R(x, y - .95 * rb, 2.4 * rb, .35 * rb);
    default: return '';
  }
}
/* A full column: shaft + base + capital, optional draw-on reveal from the floor up. */
function column(o) {
  const { x, y, h, d, top = 1, taper = 'entasis', shape = 'round', flute = false, panel = null, cap = 'tuscan', base = 'tuscan',
    reveal = 1, op = 1, pal = 'stone', grain = false } = o;
  if (op <= .001 || reveal <= .001) return '';
  const id = 'k' + (UID++), P = PAL[pal], ln = P.line, fill = `url(#${id}g)`;
  const rb = d / 2, rt = rb * top;
  const capH = CAPK[cap] * rt, baseH = BASEK[base] * rb;
  const y0 = y - baseH, y1 = y - h + capH, sh = y0 - y1;
  const Rf = q => { if (top === 1) return rb; if (taper === 'linear') return rb - (rb - rt) * q; const u = q < 1 / 3 ? 0 : (q - 1 / 3) / (2 / 3); return rb - (rb - rt) * (1 - Math.cos(u * Math.PI / 2)); };
  const N = 28; const L = [], Rr = [];
  for (let i = 0; i <= N; i++) { const q = i / N, r = Rf(q), yy = y0 - q * sh; L.push(f1(x - r) + ',' + f1(yy)); Rr.push(f1(x + r) + ',' + f1(yy)); }
  let s = `<polygon points="${L.join(' ')} ${Rr.reverse().join(' ')}" fill="${fill}" stroke="${ln}" stroke-width="1.2"/>`;
  if (flute) {
    const n = shape === 'round' ? 9 : 5;
    for (let k = 0; k < n; k++) {
      const th = shape === 'round' ? -1.25 + 2.5 * k / (n - 1) : 0, fx = shape === 'round' ? Math.sin(th) : -.64 + 1.28 * k / (n - 1);
      const pts = []; for (let i = 0; i <= N; i++) { const q = i / N; if (q < .05 || q > .95) continue; pts.push(f1(x + Rf(q) * fx) + ',' + f1(y0 - q * sh)); }
      const wgt = shape === 'round' ? Math.cos(th) : .8;
      s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${ln}" stroke-opacity="${(.22 + .4 * wgt).toFixed(2)}" stroke-width="${f1(Math.max(1, d * .022 * (.4 + wgt)))}" stroke-linecap="round"/>`;
    }
  }
  if (panel) {
    const qa = .07, qb = .93, pts = [[qa, -1], [qb, -1], [qb, 1], [qa, 1]].map(([q, sg]) => f1(x + sg * Rf(q) * .66) + ',' + f1(y0 - q * sh));
    s += `<polygon points="${pts.join(' ')}" fill="none" stroke="${ln}" stroke-width="2" opacity=".75"/>`;
    const pts2 = [[qa + .015, -1], [qb - .015, -1], [qb - .015, 1], [qa + .015, 1]].map(([q, sg]) => f1(x + sg * Rf(q) * .58) + ',' + f1(y0 - q * sh));
    s += `<polygon points="${pts2.join(' ')}" fill="none" stroke="${panel === 'recessed' ? '#000' : '#fff'}" stroke-width="1.2" opacity=".25"/>`;
  }
  if (grain) {
    const rnd = rng(7);
    for (let k = 0; k < 9; k++) {
      const fx = -.85 + 1.7 * k / 8 + (rnd() - .5) * .08, ph = rnd() * 6, amp = 1.5 + rnd() * 2.5; const pts = [];
      for (let i = 0; i <= 40; i++) { const q = i / 40; const yy = y0 - q * sh; pts.push(f1(x + Rf(q) * fx + Math.sin(q * 18 + ph) * amp) + ',' + f1(yy)); }
      s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${ln}" stroke-opacity=".45" stroke-width="1.3"/>`;
    }
  }
  s += baseSvg(base, x, y, rb, fill, ln) + capSvg(cap, x, y1, rt, fill, ln);
  const half = Math.max(rb * 1.7, rt * 1.6);
  const clipY = y - (h + 4) * reveal;
  return `<g opacity="${op.toFixed(3)}"><defs>${gradDef(id + 'g', x, half, P)}<clipPath id="${id}c"><rect x="${f1(x - half - 20)}" y="${f1(clipY)}" width="${f1(2 * half + 40)}" height="${f1(y - clipY + 4)}"/></clipPath></defs><g clip-path="url(#${id}c)">${s}</g></g>`;
}

/* ---------- plan-view (top-down) diagrams ---------- */
const WALL = 'url(#hatch)', SHAFT = '#e9e3d7', SHAFT_LN = '#8e8472';
const ringD = (cx, cy, R, r) => `M${f1(cx - R)},${f1(cy)}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0Z M${f1(cx - r)},${f1(cy)}a${r},${r} 0 1,1 ${2 * r},0a${r},${r} 0 1,1 ${-2 * r},0Z`;
function sectorD(cx, cy, R, r, a1, a2) {
  const p = (rad, a) => [cx + rad * Math.cos(a * Math.PI / 180), cy + rad * Math.sin(a * Math.PI / 180)];
  const lg = (a2 - a1) > 180 ? 1 : 0; const [x1, y1] = p(R, a1), [x2, y2] = p(R, a2), [x3, y3] = p(r, a2), [x4, y4] = p(r, a1);
  return `M${f1(x1)},${f1(y1)}A${R},${R} 0 ${lg},1 ${f1(x2)},${f1(y2)}L${f1(x3)},${f1(y3)}A${r},${r} 0 ${lg},0 ${f1(x4)},${f1(y4)}Z`;
}
const shaftPath = d => `<path d="${d}" fill="${SHAFT}" stroke="${SHAFT_LN}" stroke-width="1.5" fill-rule="evenodd"/>`;
function plan(type, cx, cy, R) {
  const r = R * .82, id = 'p' + (UID++);
  const wall = (x, y, w, h) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="${WALL}" stroke="#4b5b6c"/>`;
  switch (type) {
    case 'A': return shaftPath(ringD(cx, cy, R, r)) + T(cx, cy + 6, 'hollow', { size: 15, fill: C.dim, anchor: 'middle' });
    case 'B': return wall(cx, cy - R - 22, R + 22, R + 22) + shaftPath(sectorD(cx, cy, R, r, 0, 270));
    case 'C': return `<defs><clipPath id="${id}"><rect x="${f1(cx - R / 2)}" y="${f1(cy - R - 2)}" width="${f1(1.5 * R + 4)}" height="${f1(2 * R + 4)}"/></clipPath></defs>`
      + wall(cx - R / 2 - 22, cy - R - 18, 22, 2 * R + 36) + `<g clip-path="url(#${id})">${shaftPath(ringD(cx, cy, R, r))}</g>`;
    case 'D': return `<defs><clipPath id="${id}"><rect x="${f1(cx)}" y="${f1(cy - R - 2)}" width="${f1(R + 4)}" height="${f1(2 * R + 4)}"/></clipPath></defs>`
      + wall(cx - 22, cy - R - 18, 22, 2 * R + 36) + `<g clip-path="url(#${id})">${shaftPath(ringD(cx, cy, R, r))}</g>`;
    case 'Q': return wall(cx - 22, cy - 22, R + 44, 22) + wall(cx - 22, cy, 22, R + 22) + shaftPath(sectorD(cx, cy, R, r, 0, 90));
    case 'R': { const ps = r * 1.05; return shaftPath(sectorD(cx, cy, R, r, -86, 86)) + shaftPath(sectorD(cx, cy, R, r, 94, 266))
      + `<rect x="${f1(cx - ps / 2)}" y="${f1(cy - ps / 2)}" width="${f1(ps)}" height="${f1(ps)}" fill="#7a5233" stroke="#3b2414"/>` + T(cx, cy + 5, 'post', { size: 15, fill: '#f3e2cc', anchor: 'middle' }); }
    case 'E': { const s = R * 1.7, t = R * .26; return `<path d="M${f1(cx - s / 2)},${f1(cy - s / 2)}h${s}v${s}h${-s}Z M${f1(cx - s / 2 + t)},${f1(cy - s / 2 + t)}v${s - 2 * t}h${s - 2 * t}v${-(s - 2 * t)}Z" fill="${SHAFT}" stroke="${SHAFT_LN}" stroke-width="1.5" fill-rule="evenodd"/>`; }
    case 'K': { const s = R * 1.7, t = R * .26, x0 = cx - s / 2, y0 = cy - s / 2; return wall(x0 - 22, y0 - 18, 22, s + 36)
      + `<path d="M${f1(x0)},${f1(y0)}h${s}v${s}h${-s}v${-t}h${s - t}v${-(s - 2 * t)}h${-(s - t)}Z" fill="${SHAFT}" stroke="${SHAFT_LN}" stroke-width="1.5"/>`
      + `<rect x="${f1(x0 + 6)}" y="${f1(cy - s * .2)}" width="${f1(s * .4)}" height="${f1(s * .4)}" fill="#7a5233" stroke="#3b2414"/>`; }
    default: return '';
  }
}

    { a: 4.6, x: 610, n: 'Endura-Craft™', m: 'Cellular PVC · Craftsman', k: 'deco', note: 'wraps a structural post', o: { shape: 'square', top: .6, taper: 'linear', cap: 'craftsman', base: 'craftsman', pal: 'pvc', panel: 'recessed' } },
    { a: 11, x: 970, n: 'Endurathane', m: 'Polyurethane faux wood', k: 'deco', note: '6 wood textures', o: { shape: 'square', cap: 'craftsman', base: 'craftsman', pal: 'wood', grain: true } },

  ];
  const hl = prog(t, 25, .8);
  fam.forEach((f, i) => {

      + rise(t, f.a + .5, T(f.x, 738, f.n, { size: 28, w: 800, anchor: 'middle', fill: i === 0 ? C.gold : C.ink }) + T(f.x, 772, f.m, { size: 19, fill: C.mute, anchor: 'middle' })
        + badge(f.x, 814, f.k) + T(f.x, 860, f.note, { size: 18, fill: C.dim, anchor: 'middle' })));
  });
  s += foot('Also in the family: Endura-Classic™ large architectural columns and wood columns. Illustrations are schematic.', prog(t, 1, .6), 1810, 150, 'end');
  return s;
});

/* 13 — Competitors */
S('Competitors', 42, [

], t => {
  let s = eyebrowTitle(t, 'CHAPTER 13', 'How we compare');
  const cols = [110, 470, 905, 1065, 1555];

  const rows = [

    [5, ['Turncraft', 'Poly-Classic®'], ['Rotocast FRP'], 'Yes', ['10k / 14k / 18k / 20k lb', '8″ / 10″ / 12″ / 14″ concentric'], ['Limited lifetime', '(original purchaser)']],
    [12, ['HB&G', 'PermaCast®'], ['FRP: fiberglass +', 'marble dust'], 'Yes', ['4,580 → 10,000 lb avg. allowable', '2024 chart, round tapered, 6″ → 18″+'], ['Lifetime of', 'ownership']],
    [19, ['Chadsworth', 'PolyStone®'], ['Polyester resin, fiber-', 'glass, marble dust'], 'Yes', ['Up to 25,000 lb', 'depending on diameter'], ['Lifetime']],
    [25, ['Fypon®'], ['Polyurethane', '4-panel wrap'], 'No', ['n/a: decorative wrap'], ['—']],
    [25.8, ['AFCO'], ['Extruded, powder-', 'coated aluminum'], 'Yes', ['20,000–50,000 lb', 'listing titles, by model'], ['—']],
  ];
  const curIdx = [0, 5, 12, 19, 25, 999].reduce((a, v, i) => t >= v ? i : a, 0);
  rows.forEach((r, i) => {
    const y = 268 + i * 100, focus = (i === curIdx || (curIdx === 4 && i === 5)) && t < 32;
    const stroke = r[6] ? C.gold : focus ? C.blue : C.line;
    let g = rect(cols[0], y, 1710, 90, { fill: r[6] ? '#1f2a1d' : C.panel, stroke, sw: r[6] || focus ? 2.5 : 1.2, rx: 10 });
    g += TL(cols[0] + 18, y + (r[1].length > 1 ? 38 : 54), r[1], { size: 24, w: 800, fill: r[6] ? C.gold : C.ink, lh: 30 });
    g += TL(cols[1] + 18, y + (r[2].length > 1 ? 38 : 54), r[2], { size: 20, fill: C.mute, lh: 27 });
    g += T(cols[2] + 18, y + 54, r[3], { size: 24, w: 800, fill: r[3].startsWith('Yes') ? C.green : C.amber });
    g += T(cols[3] + 18, y + (r[4].length > 1 ? 40 : 54), r[4][0], { size: 22, w: 700 }) + (r[4][1] ? T(cols[3] + 18, y + 68, r[4][1], { size: 17, fill: C.mute }) : '');
    g += TL(cols[4] + 18, y + (r[5].length > 1 ? 40 : 54), r[5], { size: 20, fill: C.ink, lh: 26 });
    s += rise(t, r[0], g, .6, 14);
  });
  s += G(prog(t, .8, .5), T(cols[0], 900, '* whole (unsplit) Plan A / E only', { size: 17, fill: C.dim }));
  s += G(prog(t, 32, .6), chip(960, 900, '⚠  AFCO “Endura-Aluminum” (EA… SKUs) is NOT Endura-Stone', { size: 22, w: 800, anchor: 'middle', stroke: C.amber, color: C.amber }));
  s += G(prog(t, 37, .6), chip(1810, 150, 'Compare SKU-to-SKU: test methods differ', { size: 22, w: 700, anchor: 'end', stroke: C.blue }));
  return s;
});

/* 14 — Scenarios */
S('Which product?', 40, [

/* 15 — Recap */

/* ============================================================
   Engine: header, captions, timeline, player.
   ============================================================ */
let acc = 0; SCENES.forEach(sc => { sc.start = acc; acc += sc.dur; });
const TOTAL = acc;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function sceneAt(Tm) { for (let i = SCENES.length - 1; i >= 0; i--) if (Tm >= SCENES[i].start) return i; return 0; }
function captionSvg(sc, lt, fadeOp) {
  let cur = null, ct = 0; sc.caps.forEach(c => { if (lt >= c[0]) { cur = c[1]; ct = c[0]; } });
  if (!cur) return '';
  const op = Math.min(prog(lt, ct, .35), fadeOp), lines = wrap(cur, 74);
  const h = 40 + lines.length * 44, y = 1040 - h;
  return G(op, rect(150, y, 1620, h, { fill: 'rgba(5,10,16,.78)', rx: 16 }) + TL(960, y + 50, lines, { size: 34, w: 500, anchor: 'middle', lh: 44 }));
}
function frameSvg(Tm) {
  Tm = clamp(Tm, 0, TOTAL - 1e-3);
  const i = sceneAt(Tm), sc = SCENES[i], lt = Tm - sc.start;
  const fadeOp = Math.min(clamp(lt / .5), clamp((sc.dur - lt) / .45));
  UID = 0;
  let body = '';
  try { body = sc.draw(lt); } catch (e) { body = T(960, 540, 'Render error: ' + e.message, { size: 30, fill: C.red, anchor: 'middle' }); console.error(e); }
  const ticks = SCENES.map(s2 => `<rect x="${f1(s2.start / TOTAL * W)}" y="82" width="2" height="8" fill="${C.bg0}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs><radialGradient id="bgg" cx=".5" cy=".35" r=".9"><stop offset="0" stop-color="${C.bg1}"/><stop offset="1" stop-color="${C.bg0}"/></radialGradient>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#2b3946"/><line x1="0" y1="0" x2="0" y2="10" stroke="#566778" stroke-width="3"/></pattern>
<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern></defs>
<rect width="${W}" height="${H}" fill="url(#bgg)"/><rect width="${W}" height="${H}" fill="url(#grid)"/>
<g opacity="${fadeOp.toFixed(3)}">${body}</g>
<rect x="0" y="0" width="${W}" height="82" fill="#0a121a" opacity=".85"/>
<text x="60" y="50" font-size="21" letter-spacing="3" font-family="${FONT}" fill="${C.ink}" font-weight="800">ENDURA-STONE™ COLUMNS<tspan font-weight="500" fill="${C.mute}">  ·  PRODUCT TRAINING</tspan></text>
${T(1860, 50, `${String(i + 1).padStart(2, '0')} / ${SCENES.length}   ${sc.chapter}`, { size: 21, w: 600, fill: C.mute, anchor: 'end' })}
<rect x="0" y="82" width="${W}" height="8" fill="#1b2836"/><rect x="0" y="82" width="${f1(Tm / TOTAL * W)}" height="8" fill="${C.gold}"/>${ticks}
${captionSvg(sc, lt, fadeOp)}
</svg>`;
}

/* ---------- player ---------- */
const stage = document.getElementById('stage');
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
let now = 0, playing = false, last = 0, speed = 1;
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
scrub.max = TOTAL;
const chapEl = document.getElementById('chapters');
SCENES.forEach((sc, i) => { const b = document.createElement('button'); b.innerHTML = `<span>${fmt(sc.start)}</span>${String(i + 1).padStart(2, '0')} · ${sc.chapter}`; b.onclick = () => { seek(sc.start + .01); }; chapEl.appendChild(b); });
function paint() {
  stage.innerHTML = frameSvg(now);
  scrub.value = now; timeEl.textContent = fmt(now) + ' / ' + fmt(TOTAL);
  const ci = sceneAt(now); [...chapEl.children].forEach((b, i) => b.classList.toggle('on', i === ci));
}
function seek(t) { now = clamp(t, 0, TOTAL); paint(); }
function loop(ts) { if (!playing) return; const dt = (ts - last) / 1000; last = ts; now += dt * speed; if (now >= TOTAL) { now = TOTAL; playing = false; playBtn.textContent = '↺ Replay'; } paint(); if (playing) requestAnimationFrame(loop); }
function toggle() { if (now >= TOTAL) now = 0; playing = !playing; playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) { last = performance.now(); requestAnimationFrame(loop); } }
playBtn.onclick = toggle;
scrub.oninput = () => seek(+scrub.value);
document.getElementById('speed').onchange = e => { speed = +e.target.value; };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.code === 'ArrowRight') seek(now + 5); if (e.code === 'ArrowLeft') seek(now - 5); });
// Hooks for render.mjs (frame-exact capture).
window.__TOTAL = TOTAL;
window.__seek = t => { now = t; stage.innerHTML = frameSvg(t); };
window.__chapters = SCENES.map(s2 => ({ chapter: s2.chapter, start: s2.start, dur: s2.dur }));
paint();
</script>
